name: tricgabay_app
description: "Tric Gabay - Tour Guide & Tricycle Booking App for Bustos, Bulacan"
publish_to: 'none'

version: 1.0.0+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter


  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0

  # Push notifications only. Supabase remains the single source of truth.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.5
  firebase_performance: ^0.10.0+10

  flutter_localizations:
    sdk: flutter

  # Maps & Location
  # Keep the mobile SDK reproducible. Web support requires a separate v3 migration.
  mapbox_maps_flutter: 2.30.1
  geolocator: ^13.0.2

  # UI & Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0
  flutter_rating_bar: ^4.0.1
  fl_chart: ^0.69.0

  # Utilities
  image_picker: ^1.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  # 13.2+ moved the Android plugin to a Gradle/Kotlin configuration that
  # currently fails under this app's AGP 9 toolchain. 13.1 keeps the same
  # SharePlus API without that regression.
  share_plus: 13.1.0
  uuid: ^4.5.1
  package_info_plus: ^10.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  analyzer: 10.1.0
  flutter_test:
    sdk: flutter
  # On-device screen renders: integration_test/screens_on_device_test.dart
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  image: ^4.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/tric_gabay_logo.png
    - assets/optimized_images/
    - assets/optimized_images/places/
    - assets/google_fonts/

# Native launch screen. It matches the first Flutter frame (brand blue with
# the logo centred at 128dp), so launch hands over without a white flash.
# Regenerate after changes: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0038A8"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0038A8"
    image: assets/images/splash_logo_android12.png
  web: false
